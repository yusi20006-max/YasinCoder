name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout clean clone
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify clean-clone invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f VERSION
          test -f pyproject.toml
          test -f config.example
          test -f docs/ARCHITECTURE.md
          test -f docs/CONFIGURATION.md
          test -f docs/GATEWAY.md
          grep -Fq '*.gguf' .gitignore
          grep -Fq '*.safetensors' .gitignore
          grep -Fq '*.bin' .gitignore
          grep -Fq 'models/' .gitignore
      - name: Build and install package from clean source
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run deterministic test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Security and repository hygiene checks
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files)
          if printf '%s\n' "$tracked" | grep -Eiq '(^|/)(\.env|\.env\.|.*\.(pem|key|p12|pfx|gguf|safetensors|bin))$'; then
            echo 'Potential secret or model artifact tracked by git' >&2
            printf '%s\n' "$tracked" | grep -Ei '(^|/)(\.env|\.env\.|.*\.(pem|key|p12|pfx|gguf|safetensors|bin))$' >&2
            exit 1
          fi
          if git grep -nEI '(sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})' -- . ':!docs' ':!.github' ; then
            echo 'Potential credential-like token found in tracked source' >&2
            exit 1
          fi
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict -r requirements.txt
      - name: Build wheel artifact
        run: |
          python -m pip install "setuptools>=68" wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker JavaScript
        run: node --check worker/src/index.js
      - name: Verify Worker deployment contract
        shell: bash
        run: |
          set -euo pipefail
          test -f worker/wrangler.toml
          test -f worker/src/index.js
          grep -Fq 'YASIN_WORKER_API_KEY' worker/src/index.js
          grep -Fq 'YASIN_UPSTREAM_URL' worker/src/index.js
          grep -Fq 'YASIN_MAX_BODY_BYTES' worker/src/index.js
          grep -Fq 'YASIN_RATE_LIMIT_PER_MINUTE' worker/src/index.js

  platform:
    name: ${{ matrix.os }} platform integration
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout clean clone
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install package
        run: python -m pip install --upgrade pip && python -m pip install --no-deps .
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Platform integration tests
        run: python -m unittest tests.test_platform_integration tests.test_tui -v
      - name: CLI smoke test
        run: python -m main info
